name: ci

on:
  push:
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + integration tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: src:.
        run: pytest -q

      - name: Documentation invariants (Task 11)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: src:.
        run: pytest -q tests/test_documentation_invariants.py

      - name: Lattice / experiment validation (Task 10)
        env:
          PYTHONPATH: src:.
        run: python -m experiments.validation

      - name: Decision gate honesty (dry-run → INSUFFICIENT_EVIDENCE)
        env:
          PYTHONPATH: src:.
        run: |
          set +e
          python experiments/decision_gate.py \
            --run experiments/baselines/runs/task8_dryrun_all.json
          code=$?
          set -e
          # Exit 2 is the honest no-completed-evidence result; never treat as PASS.
          test "$code" -eq 2
