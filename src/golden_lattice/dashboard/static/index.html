<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Lattice — Dashboard</title>
<!--
  Progressive enhancement only: if the Google Fonts CDN is reachable the page
  renders in Spectral + JetBrains Mono; offline/local it falls back to the
  system serif/mono stacks below and keeps working. (Self-hosting the woff2
  files is the documented follow-up; the runtime never hard-depends on the CDN.)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d11;
    --panel: #14161d;
    --border: #242832;
    --border-soft: #1c1f27;
    --text: #d7dbe4;
    --text-bright: #eef0f4;
    --text-mid: #aab0bc;
    --dim: #707682;
    --dimmer: #5a606c;
    --opus: oklch(0.72 0.16 308);
    --sonnet: oklch(0.79 0.12 226);
    --haiku: oklch(0.81 0.15 158);
    --gold: oklch(0.84 0.14 88);
    --critique: oklch(0.67 0.18 25);
    --augment: oklch(0.74 0.10 250);
    --present: oklch(0.78 0.13 158);
    --serif: 'Spectral', Georgia, 'Times New Roman', serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    -webkit-font-smoothing: antialiased;
    color: var(--text);
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.6;
    padding: 0 0 96px 0;
    position: relative;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #323744; }
  @keyframes glDot { 0%,100% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }
  .mono { font-family: var(--mono); }
  .reveal { opacity: 0; transform: translateY(10px); transition: opacity .5s ease, transform .5s ease; }
  .reveal.refl { transition: opacity .6s ease, transform .6s ease; }
  /* The phase spine */
  .spine { display: grid; grid-template-columns: 64px 1fr; gap: 24px; }
  .spine-num { display: flex; flex-direction: column; align-items: center; }
  .spine-num .n { font-family: var(--mono); font-size: 13px; font-weight: 600; color: #6b7280; }
  .spine-num .line { width: 1px; flex: 1; background: var(--border-soft); margin-top: 10px; }
  /* Transport scrubber */
  #gl-scrub { -webkit-appearance: none; appearance: none; height: 3px; background: var(--border); border-radius: 2px; outline: none; cursor: pointer; }
  #gl-scrub::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--gold); border: 2px solid var(--bg); cursor: pointer; box-shadow: 0 0 10px -1px oklch(0.84 0.14 88 / 0.6); }
  #gl-scrub::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--gold); border: 2px solid var(--bg); cursor: pointer; }
  .tbtn { font-family: var(--mono); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pill { font-family: var(--mono); cursor: pointer; transition: all .2s ease; white-space: nowrap; }
  .col-pad { padding: 14px 0 40px 0; }
  .phase-title { font-family: var(--mono); font-size: 13px; letter-spacing: 0.2em; color: #cdd2db; text-transform: uppercase; }
  .phase-lead { color: var(--dim); font-size: 14px; margin-top: 8px; max-width: 700px; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  // ---------- constants ----------
  var COLOR = {
    'claude-fable-5': 'oklch(0.78 0.16 35)',
    'claude-opus-5': 'oklch(0.72 0.16 308)',
    'claude-sonnet-5': 'oklch(0.79 0.12 226)',
    'claude-haiku-4-5-20251001': 'oklch(0.81 0.15 158)',
    'claude-haiku-4-5': 'oklch(0.81 0.15 158)'
  };
  var SHORT = {
    'claude-fable-5': 'FABLE',
    'claude-opus-5': 'OPUS',
    'claude-sonnet-5': 'SONNET',
    'claude-haiku-4-5-20251001': 'HAIKU',
    'claude-haiku-4-5': 'HAIKU'
  };
  var CH = { critique: 'oklch(0.67 0.18 25)', augment: 'oklch(0.74 0.10 250)', converge: 'oklch(0.84 0.14 88)' };
  var CHB = { critique: 'oklch(0.67 0.18 25 / 0.4)', augment: 'oklch(0.74 0.10 250 / 0.4)', converge: 'oklch(0.84 0.14 88 / 0.45)' };
  var GOLD = 'oklch(0.84 0.14 88)';
  var DISP_COLOR = { present: 'oklch(0.78 0.13 158)', modified: 'oklch(0.84 0.14 88)', omitted: 'oklch(0.67 0.18 25)' };
  var PLAY_PERIOD_MS = 360;

  function colorOf(m) { return COLOR[m] || '#8b919d'; }
  function shortOf(m) { return SHORT[m] || (m || '').toUpperCase(); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

  // ---------- top-level UI state ----------
  var UI = {
    sessions: null,
    sessionIdx: 0,
    mode: 'replay',          // 'replay' | 'live'
    live: null,              // normalized live session object
    liveStatus: 'connecting…',
    step: 0,
    playing: false,
    speed: 1,
    geom: null,              // measured phase-2 node/anchor positions
    sessionInFlight: false   // live: between session_started and session_completed
  };

  // Per-session derived data (recomputed by prepare()).
  var D = null;              // { maps, bounds, N, author, claimText, disagree, elevTurns, elevClaims }
  var built = null;          // refs into the current DOM: { revealables:[{el,beat}], arcs:[...], svg, p2cont }
  var timer = null;
  var ws = null;
  var retryTimer = null;
  var liveObj = null;        // mutable live accumulator

  var app = document.getElementById('app');

  // ---------- derivation (port of prototype prepare()) ----------
  function claimsOf(data, m) { return (data.phase1[m] && data.phase1[m].claims) || []; }

  function prepare(data) {
    var M = data.models;
    var k = 0;
    var p0 = data.phase0;
    var groundingR = -1, propR = [], frozenR = -1, resultR = [];
    if (p0) {
      groundingR = k++;
      propR = (p0.proposals || []).map(function () { return k++; });
      frozenR = k++;
      resultR = (p0.results || []).map(function () { return k++; });
    }
    var p0End = k - 1;
    var claimR = {}, reflR = {}, crR = {}, turnR = {};
    var cols = M.map(function (m) { return claimsOf(data, m); });
    var maxC = Math.max.apply(null, [1].concat(cols.map(function (c) { return c.length; })));
    for (var i = 0; i < maxC; i++) {
      for (var mi = 0; mi < M.length; mi++) {
        var c = claimsOf(data, M[mi])[i];
        if (c) claimR[c.id] = k++;
      }
    }
    M.forEach(function (m) { reflR[m] = k++; });
    var p1End = k - 1;
    (data.crossreadings || []).forEach(function (cr, idx) { crR[idx] = k++; });
    var p2Start = p1End + 1, p2End = k - 1;
    (data.turns || []).forEach(function (t) { turnR[t.id] = k++; });
    var p3Start = p2End + 1, p3End = k - 1;
    var ledgerR = k++, parityR = k++;
    var synthLines = (((data.synthesis && data.synthesis.output) || '').split('\n')).filter(function (l) { return l.trim(); });
    var synthR = synthLines.map(function () { return k++; });
    var p4Start = p3End + 1;

    var author = {}, claimText = {};
    M.forEach(function (m) {
      claimsOf(data, m).forEach(function (c) { author[c.id] = m; claimText[c.id] = c.text; });
    });
    var disagree = {};
    (data.crossreadings || []).forEach(function (cr) {
      (cr.disagreements || []).forEach(function (d) {
        (disagree[d.id] = disagree[d.id] || []).push({ reader: cr.reader, reason: d.reason });
      });
    });
    var elevTurns = {}, elevClaims = {};
    (data.elevations || []).forEach(function (e) {
      (e.converge_turn_ids || []).forEach(function (id) { elevTurns[id] = true; });
      (e.claim_ids || []).forEach(function (id) { elevClaims[id] = true; });
    });

    D = {
      maps: { groundingR: groundingR, propR: propR, frozenR: frozenR, resultR: resultR, claimR: claimR, reflR: reflR, crR: crR, turnR: turnR, ledgerR: ledgerR, parityR: parityR, synthR: synthR, synthLines: synthLines },
      bounds: { p0End: p0End, p1End: p1End, p2Start: p2Start, p2End: p2End, p3Start: p3Start, p3End: p3End, p4Start: p4Start, hasP0: !!p0 },
      N: Math.max(0, k - 1),
      author: author, claimText: claimText, disagree: disagree,
      elevTurns: elevTurns, elevClaims: elevClaims
    };
  }

  // ---------- DOM building (once per session) ----------
  function buildSession(data) {
    prepare(data);

    var parts = [];
    parts.push(mastheadHtml(data));
    parts.push('<div style="max-width:1180px;margin:0 auto;padding:0 40px;position:relative;">');
    parts.push(phase0Html(data));
    parts.push(phase1Html(data));
    parts.push(phase2Html(data));
    parts.push(phase3Html(data));
    parts.push(phase4Html(data));
    parts.push('</div>'); // phases column
    parts.push(transportHtml());

    app.innerHTML = parts.join('');

    // collect refs
    built = {
      revealables: [],
      arcs: [],
      svg: document.getElementById('gl-svg'),
      p2cont: document.getElementById('gl-p2')
    };
    var nodes = app.querySelectorAll('[data-beat]');
    for (var i = 0; i < nodes.length; i++) {
      built.revealables.push({ el: nodes[i], beat: parseInt(nodes[i].getAttribute('data-beat'), 10) });
    }
    buildArcs(data);

    UI.geom = null;
    scheduleMeasure();
    applyStep();
  }

  function mastheadHtml(data) {
    var live = UI.mode === 'live';
    var M = data.models;
    var has = function (m) { return claimsOf(data, m).length; };
    var meta = function (m) {
      var conf = (data.phase1[m] && data.phase1[m].conf) || 0;
      return has(m) + ' claims · conf ' + conf.toFixed(2);
    };
    var totalClaims = M.reduce(function (a, m) { return a + has(m); }, 0);
    var idColor = live ? 'oklch(0.67 0.18 25)' : GOLD;
    var failure = data.error ? '<div style="margin-top:18px;padding:11px 13px;background:oklch(0.67 0.18 25 / 0.08);border:1px solid oklch(0.67 0.18 25 / 0.35);border-radius:6px;color:#e6a5a5;font-family:var(--mono);font-size:11px;line-height:1.5;"><strong>session error</strong>' + (data.error.phase ? ' · ' + esc(data.error.phase) : '') + (data.error.model_id ? ' · ' + esc(shortOf(data.error.model_id)) : '') + '<br>' + esc(data.error.message) + '</div>' : '';

    var tabs = (UI.sessions || []).map(function (s, i) {
      var active = UI.mode === 'replay' && i === UI.sessionIdx;
      var col = active ? GOLD : '#8b919d';
      var bg = active ? 'oklch(0.84 0.14 88 / 0.1)' : '#14161d';
      var bd = active ? 'oklch(0.84 0.14 88 / 0.4)' : '#242832';
      return '<button class="pill" data-act="session" data-i="' + i + '" style="font-size:10.5px;letter-spacing:0.02em;color:' + col + ';background:' + bg + ';border:1px solid ' + bd + ';border-radius:14px;padding:6px 13px;">' + esc(s.title) + '</button>';
    }).join('');

    var liveCol = live ? 'oklch(0.67 0.18 25)' : '#8b919d';
    var liveBg = live ? 'oklch(0.67 0.18 25 / 0.1)' : '#14161d';
    var liveBd = live ? 'oklch(0.67 0.18 25 / 0.4)' : '#242832';
    var liveLabel = live ? 'Live' : 'Go Live';

    var legend = M.map(function (m) {
      return '<div style="display:flex;align-items:center;gap:9px;">' +
        '<span style="width:9px;height:9px;border-radius:50%;background:' + colorOf(m) + ';box-shadow:0 0 10px -1px ' + colorOf(m) + ';"></span>' +
        '<span class="mono" style="font-size:11px;letter-spacing:0.12em;color:' + colorOf(m) + ';">' + esc(shortOf(m)) + '</span>' +
        '<span class="mono" style="font-size:10.5px;color:#5a606c;">' + esc(meta(m)) + '</span>' +
        '</div>';
    }).join('');

    return '' +
      '<div style="max-width:1180px;margin:0 auto;padding:40px 40px 26px 40px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;">' +
          '<div class="mono" style="font-size:11px;letter-spacing:0.34em;color:#707682;text-transform:uppercase;">Golden Lattice · ' + (live ? 'Live Session' : 'Session Replay') + '</div>' +
          '<div class="mono" style="font-size:11px;color:' + idColor + ';letter-spacing:0.02em;">' + esc(data.id || '') + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap;">' +
          tabs +
          '<div style="flex:1;min-width:20px;"></div>' +
          '<a href="/explainer" class="pill" style="font-size:10.5px;letter-spacing:0.12em;color:#8b919d;background:#14161d;border:1px solid #242832;border-radius:14px;padding:6px 13px;text-transform:uppercase;text-decoration:none;">Explainer</a>' +
          '<button class="pill" data-act="toggle-live" style="display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:0.12em;color:' + liveCol + ';background:' + liveBg + ';border:1px solid ' + liveBd + ';border-radius:14px;padding:6px 13px;text-transform:uppercase;">' +
            '<span style="width:7px;height:7px;border-radius:50%;background:' + liveCol + ';"></span>' + liveLabel +
          '</button>' +
        '</div>' +
        '<div style="height:1px;background:linear-gradient(90deg,#242832,transparent);margin:22px 0 26px 0;"></div>' +
        '<div class="mono" style="font-size:10.5px;letter-spacing:0.26em;color:#5a606c;text-transform:uppercase;margin-bottom:14px;">The Prompt</div>' +
        '<div style="font-size:30px;line-height:1.34;font-weight:400;color:#eef0f4;max-width:920px;letter-spacing:-0.01em;">' + esc(data.prompt) + '</div>' + failure +
        '<div style="display:flex;gap:30px;margin-top:34px;flex-wrap:wrap;align-items:center;">' +
          legend +
          '<div style="flex:1;"></div>' +
          '<div class="mono" style="font-size:10.5px;color:#5a606c;letter-spacing:0.04em;">' + M.length + ' models · ' + totalClaims + ' claims · ' + (data.turns || []).length + ' turns</div>' +
        '</div>' +
      '</div>';
  }

  function phase0Html(data) {
    var p0 = data.phase0;
    if (!p0) {
      return '' +
        '<div class="spine" style="padding-top:30px;">' +
          '<div class="spine-num"><div class="n" style="color:#454b57;">00</div><div class="line"></div></div>' +
          '<div style="padding-bottom:14px;">' +
            '<div style="display:flex;align-items:baseline;gap:14px;">' +
              '<div class="mono" style="font-size:13px;letter-spacing:0.2em;color:#8b919d;text-transform:uppercase;">Investigation</div>' +
              '<div class="mono" style="font-size:10px;letter-spacing:0.16em;color:oklch(0.74 0.10 250);border:1px solid #242832;border-radius:3px;padding:2px 7px;text-transform:uppercase;">skipped</div>' +
            '</div>' +
            '<div style="color:#707682;font-size:14px;margin-top:8px;max-width:680px;">No external evidence required. The shared feed holds only the deterministic temporal grounding — the session proceeds directly to independent generation.</div>' +
          '</div>' +
        '</div>';
    }
    var maps = D.maps;
    var props = (p0.proposals || []).map(function (pr, i) {
      var queries = (pr.queries || []).map(function (q) {
        return '<div class="mono" style="font-size:10px;color:#9aa0ac;background:#14161d;border:1px solid #1f232c;border-radius:4px;padding:5px 8px;margin-bottom:5px;word-break:break-all;line-height:1.4;">' + esc(q) + '</div>';
      }).join('');
      return '<div class="reveal" data-beat="' + maps.propR[i] + '">' +
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">' +
          '<span style="width:6px;height:6px;border-radius:50%;background:' + colorOf(pr.model) + ';"></span>' +
          '<span class="mono" style="font-size:10px;letter-spacing:0.1em;color:' + colorOf(pr.model) + ';">' + esc(shortOf(pr.model)) + '</span>' +
          '<span class="mono" style="font-size:9px;color:#5a606c;">proposes ' + pr.count + '</span>' +
        '</div>' + queries + '</div>';
    }).join('');

    var results = '';
    if ((p0.results || []).length) {
      results = '<div style="display:flex;flex-direction:column;gap:7px;">' + p0.results.map(function (r, i) {
        return '<div class="reveal" data-beat="' + maps.resultR[i] + '" style="padding:9px 12px;background:#14161d;border-left:2px solid oklch(0.78 0.13 158 / 0.5);border-radius:0 5px 5px 0;">' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<span class="mono" style="color:oklch(0.78 0.13 158);font-size:10px;">✓</span>' +
            '<span class="mono" style="font-size:11px;color:#cbd0d9;word-break:break-all;">' + esc(r.query) + '</span>' +
          '</div>' +
          '<div class="mono" style="font-size:10.5px;color:#6b7280;margin-top:5px;line-height:1.5;">' + esc(r.preview) + '</div>' +
        '</div>';
      }).join('') + '</div>';
    } else {
      results = '<div class="mono" style="font-size:11px;color:#5a606c;padding:4px 0;">Union proposed, no searches executed this run — the feed froze on grounding alone.</div>';
    }
    var failed = (p0.failed || []).map(function (f) {
      return '<div style="padding:9px 12px;background:#14161d;border-left:2px solid oklch(0.67 0.18 25 / 0.5);border-radius:0 5px 5px 0;margin-top:7px;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span class="mono" style="color:oklch(0.67 0.18 25);font-size:10px;">✗</span>' +
          '<span class="mono" style="font-size:11px;color:#cbd0d9;word-break:break-all;">' + esc(f.query) + '</span>' +
        '</div>' +
        '<div class="mono" style="font-size:10.5px;color:#6b7280;margin-top:5px;">' + esc(f.reason) + '</div>' +
      '</div>';
    }).join('');

    return '' +
      '<div class="spine" style="padding-top:30px;">' +
        '<div class="spine-num"><div class="n" style="color:oklch(0.74 0.10 250);">00</div><div class="line"></div></div>' +
        '<div style="padding:0 0 40px 0;">' +
          '<div style="display:flex;align-items:baseline;gap:14px;">' +
            '<div class="mono" style="font-size:13px;letter-spacing:0.2em;color:#cdd2db;text-transform:uppercase;">Investigation</div>' +
            '<div class="mono" style="font-size:10px;letter-spacing:0.16em;color:oklch(0.74 0.10 250);border:1px solid oklch(0.74 0.10 250 / 0.4);border-radius:3px;padding:2px 7px;text-transform:uppercase;">ran</div>' +
          '</div>' +
          '<div style="color:#707682;font-size:14px;margin-top:8px;max-width:700px;">Each model independently proposes up to three searches — blind, like Phase 1. A non-model executor runs the <span style="color:#cdd2db;">rule-based union</span>, then the evidence feed is <span style="color:oklch(0.84 0.14 88);">frozen</span> before any model generates.</div>' +
          '<div data-beat="' + maps.groundingR + '" data-grounding="1" style="margin-top:20px;display:flex;align-items:center;gap:10px;transition:opacity 0.5s ease;">' +
            '<span class="mono" style="font-size:9px;letter-spacing:0.14em;color:oklch(0.84 0.14 88);text-transform:uppercase;border:1px solid oklch(0.84 0.14 88 / 0.3);border-radius:3px;padding:2px 6px;">grounding</span>' +
            '<span class="mono" style="font-size:11px;color:#8b919d;">' + esc(p0.grounding) + '</span>' +
            '<span class="mono" style="font-size:10px;color:#454b57;">deterministic · not a model action</span>' +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:18px;align-items:start;">' + props + '</div>' +
          '<div data-beat="' + maps.frozenR + '" data-grounding="1" style="display:flex;justify-content:center;margin:14px 0;transition:opacity 0.5s ease;">' +
            '<div style="display:flex;align-items:center;gap:12px;background:oklch(0.84 0.14 88 / 0.06);border:1px solid oklch(0.84 0.14 88 / 0.2);border-radius:7px;padding:9px 18px;">' +
              '<span class="mono" style="font-size:10px;letter-spacing:0.08em;color:#8b919d;text-transform:uppercase;">rule-based union</span>' +
              '<span class="mono" style="font-size:11px;color:#cdd2db;">' + p0.unique + ' unique</span>' +
              '<span style="color:#454b57;">→</span>' +
              '<span class="mono" style="font-size:11px;color:oklch(0.84 0.14 88);">feed frozen · ' + p0.frozen + ' entries</span>' +
            '</div>' +
          '</div>' +
          results + failed +
        '</div>' +
      '</div>';
  }

  function tint(m, a) {
    // model color at given alpha — derive oklch(... / a) from the base.
    var base = colorOf(m);
    if (base.indexOf('oklch(') !== 0) return base;
    var inner = base.replace(/^oklch\(/, '').replace(/\)$/, '');

            '<div class="mono" style="font-size:10px;letter-spacing:0.2em;color:oklch(0.84 0.14 88);text-transform:uppercase;margin-bottom:20px;">Co-authored output</div>' +

  // ---------- arcs ----------
  function buildArcs(data) {
    built.arcs = [];
    if (!built.svg) return;
    var svgNs = 'http://www.w3.org/2000/svg';
    (data.crossreadings || []).forEach(function (cr, i) {
      (cr.agreements || []).forEach(function (cid) {
        var gold = !!D.elevClaims[cid];
        var path = document.createElementNS(svgNs, 'path');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', gold ? GOLD : colorOf(cr.reader));
        path.setAttribute('stroke-width', gold ? '1.5' : '1');
        path.setAttribute('pathLength', '1');
        path.setAttribute('stroke-dasharray', '1');
        path.style.strokeDashoffset = '1';
        path.style.opacity = '0';
        path.style.transition = 'stroke-dashoffset 0.7s ease, opacity 0.5s ease';
        built.svg.appendChild(path);
        built.arcs.push({ el: path, reader: cr.reader, cid: cid, gold: gold, beat: D.maps.crR[i] });
      });
    });
  }

  function scheduleMeasure() {
    requestAnimationFrame(function () { requestAnimationFrame(measure); });
    [250, 700, 1400].forEach(function (ms) { setTimeout(measure, ms); });
  }

  function measure() {
    var cont = built && built.p2cont;
    if (!cont) return;
    var nodes = {}, anchors = {};
    cont.querySelectorAll('[data-claim]').forEach(function (el) {
      nodes[el.getAttribute('data-claim')] = { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
    });
    cont.querySelectorAll('[data-anchor]').forEach(function (el) {
      anchors[el.getAttribute('data-anchor')] = { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight };
    });
    if (Object.keys(nodes).length === 0) return;
    UI.geom = { nodes: nodes, anchors: anchors };
    built.arcs.forEach(function (arc) {
      var a = UI.geom.anchors[arc.reader], n = UI.geom.nodes[arc.cid];
      if (!a || !n) { arc.el.setAttribute('d', ''); return; }
      var dx = n.x - a.x;
      var cx = a.x + dx * 0.5;
      var cy = Math.min(a.y, n.y) - 26 - Math.abs(dx) * 0.06;
      arc.el.setAttribute('d', 'M ' + a.x + ' ' + a.y + ' Q ' + cx + ' ' + cy + ' ' + n.x + ' ' + n.y);
    });
    applyStep();
  }

  // ---------- per-step visibility ----------
  function applyStep() {
    if (!D || !built) return;
    var step = UI.step;

    built.revealables.forEach(function (r) {
      var on = r.beat >= 0 && step >= r.beat;
      if (r.el.hasAttribute('data-grounding')) {
        r.el.style.opacity = on ? '1' : '0';
      } else if (r.el.hasAttribute('data-ledger')) {
        r.el.style.opacity = on ? '1' : '0.15';
      } else {
        r.el.style.opacity = on ? '1' : '0';
        r.el.style.transform = on ? 'translateY(0)' : 'translateY(10px)';
      }
    });

    var p2on = step >= D.bounds.p2Start;
    if (built.p2cont) {
      built.p2cont.querySelectorAll('[data-p2node]').forEach(function (el) {
        el.style.opacity = p2on ? '1' : '0.12';
      });
      built.p2cont.querySelectorAll('[data-contest]').forEach(function (span) {
        var cid = span.getAttribute('data-contest');
        var node = span.closest('[data-claim]');
        var dis = D.disagree[cid];
        var contested = dis && p2on;
        var elevated = D.elevClaims[cid] && p2on;
        var ring = '#242832';
        if (contested) ring = 'oklch(0.67 0.18 25 / 0.55)';
        if (elevated) ring = 'oklch(0.84 0.14 88 / 0.6)';
        if (node) node.style.borderColor = ring;
        if (contested) { span.textContent = 'contested ×' + dis.length; span.style.color = 'oklch(0.67 0.18 25)'; }
        else if (elevated) { span.textContent = '✦ converged'; span.style.color = 'oklch(0.84 0.14 88)'; }
        else { span.textContent = ''; }
      });
    }

    built.arcs.forEach(function (arc) {
      var revealed = step >= arc.beat;
      arc.el.style.opacity = revealed ? (arc.gold ? '0.6' : '0.32') : '0';
      arc.el.style.strokeDashoffset = revealed ? '0' : '1';
    });

    var ledgerOn = step >= D.maps.ledgerR;
    app.querySelectorAll('[data-chip]').forEach(function (c) { c.style.opacity = ledgerOn ? '1' : '0.1'; });

    var parityOn = step >= D.maps.parityR;
    app.querySelectorAll('[data-bar]').forEach(function (b) { b.style.width = parityOn ? (b.getAttribute('data-bar') + '%') : '0%'; });

    updateTransport();
  }

  function phaseLabel() {
    var b = D.bounds, step = UI.step;
    var label = '01 · Independent', color = '#cdd2db';
    if (b.hasP0 && step <= b.p0End) { label = '00 · Investigation'; color = 'oklch(0.74 0.10 250)'; }
    else if (step <= b.p1End) { label = '01 · Independent'; color = '#cdd2db'; }
    if (step >= b.p2Start && step <= b.p2End) { label = '02 · Cross-reading'; color = '#cdd2db'; }
    if (step >= b.p3Start && step <= b.p3End) { label = '03 · Dialogue'; color = '#cdd2db'; }
    if (step >= b.p4Start) { label = '04 · Synthesis'; color = GOLD; }
    return { label: label, color: color };
  }

  function updateTransport() {
    if (UI.mode === 'live') {
      var ls = document.getElementById('gl-livestatus');
      if (ls) ls.textContent = UI.liveStatus;
      return;
    }
    var pl = document.getElementById('gl-phaselabel');
    if (pl) { var p = phaseLabel(); pl.textContent = p.label; pl.style.color = p.color; }
    var sl = document.getElementById('gl-steplabel');
    if (sl) sl.textContent = UI.step + ' / ' + D.N;
    var scrubEl = document.getElementById('gl-scrub');
    if (scrubEl && document.activeElement !== scrubEl) scrubEl.value = UI.step;
    var play = document.getElementById('gl-play');
    if (play) play.textContent = UI.playing ? '❚❚' : '▶';
  }

  // ---------- playback ----------
  function startTimer() {
    stopTimer();
    timer = setInterval(function () {
      if (UI.step >= D.N) { stopTimer(); UI.playing = false; updateTransport(); return; }
      UI.step += 1;
      lsSet('gl-replay-step', UI.step);
      applyStep();
    }, PLAY_PERIOD_MS / UI.speed);
  }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function toggle() {
    if (UI.playing) { stopTimer(); UI.playing = false; }
    else { if (UI.step >= D.N) UI.step = 0; UI.playing = true; startTimer(); }
    updateTransport();
  }
  function restart() { UI.step = 0; lsSet('gl-replay-step', 0); UI.playing = true; applyStep(); startTimer(); updateTransport(); }
  function scrub(v) { stopTimer(); UI.playing = false; UI.step = v; lsSet('gl-replay-step', v); applyStep(); }
  function cycleSpeed() {
    UI.speed = UI.speed >= 4 ? 1 : UI.speed * 2;
    if (timer) { startTimer(); }
    var b = app.querySelector('[data-act="speed"]'); if (b) b.textContent = UI.speed + '×';
  }

  // ---------- session selection ----------
  function selectSession(i) {
    if (i === UI.sessionIdx && UI.mode === 'replay') { restart(); return; }
    stopTimer();
    closeLive();
    UI.sessionIdx = i; UI.mode = 'replay'; UI.step = 0; UI.playing = true;
    lsSet('gl-sess', i); lsSet('gl-replay-step', 0);
    buildSession(UI.sessions[i]);
    startTimer();
  }

  // ---------- live mode ----------
  function toggleLive() {
    if (UI.mode === 'live') { exitLive(); return; }
    stopTimer();
    liveObj = null;
    UI.mode = 'live'; UI.live = null; UI.liveStatus = 'connecting…'; UI.step = 0; UI.sessionInFlight = false;
    renderShell();
    connectLive();
  }
  function exitLive() {
    closeLive();
    UI.mode = 'replay'; UI.step = 0; UI.playing = true;
    if (UI.sessions && UI.sessions.length) {
      buildSession(UI.sessions[UI.sessionIdx]);
      startTimer();
    } else {
      renderShell();
    }
  }
  function closeLive() {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
  }
  function connectLive() {
    if (UI.mode !== 'live') return;
    var sock;
    try {
      var proto = location.protocol === 'https:' ? 'wss' : 'ws';
      sock = new WebSocket(proto + '://' + location.host + '/ws');
    } catch (e) { UI.liveStatus = 'live transport unavailable'; renderShell(); return; }
    ws = sock;
    sock.onopen = function () { UI.liveStatus = 'connected · waiting for a run'; updateTransport(); syncPromptInput(); };
    sock.onmessage = function (e) { try { applyLiveEvent(JSON.parse(e.data)); } catch (err) {} };
    sock.onclose = function () {
      ws = null;
      if (UI.mode === 'live') { UI.liveStatus = 'no lattice detected on this host · retrying'; updateTransport(); syncPromptInput(); retryTimer = setTimeout(connectLive, 2800); }
    };
    sock.onerror = function () {};
  }

  function ensureP0(L) {
    L.phase0 = L.phase0 || { grounding: '', proposals: [], unique: 0, frozen: 0, results: [], failed: [] };
    return L.phase0;
  }

  function applyLiveEvent(ev) {
    var t = ev.event_type;
    if (t === 'session_started') {
      liveObj = {
        id: ev.session_id, title: 'LIVE', prompt: ev.prompt, models: ev.models_invited,
        phase0: null, phase1: {}, reflections: {}, crossreadings: [], turns: [],
        synthesis: { output: '', trace: [] }, metrics: null, elevations: [], error: null
      };
      (ev.models_invited || []).forEach(function (m) { liveObj.phase1[m] = { focus: '', conf: 0, claims: [], stream: '' }; liveObj.reflections[m] = {}; });
      UI.sessionInFlight = true;
    }
    var L = liveObj;
    if (!L) return;
    if (t === 'phase_0_datetime_grounding') { ensureP0(L).grounding = ev.formatted_text; }
    else if (t === 'phase_0_proposal_submitted') { var p0 = ensureP0(L); p0.proposals.push({ model: ev.model_id, count: (ev.queries || []).length, queries: ev.queries || [] }); var u = {}; p0.proposals.forEach(function (p) { (p.queries || []).forEach(function (q) { u[q] = 1; }); }); p0.unique = Object.keys(u).length; }
    else if (t === 'phase_0_search_result') { ensureP0(L).results.push({ query: ev.query, preview: ev.result_text_preview }); }
    else if (t === 'phase_0_failed_search') { ensureP0(L).failed.push({ query: ev.query, reason: ev.reason }); }
    else if (t === 'phase_0_feed_frozen') { if (L.phase0) L.phase0.frozen = ev.entry_count; }
    else if (t === 'model_stream_delta') { var streamState = L.phase1[ev.model_id] = L.phase1[ev.model_id] || { claims: [], stream: '' }; streamState.stream = (streamState.stream || '') + ev.delta; UI.liveStatus = 'streaming · ' + shortOf(ev.model_id) + ' · ' + ev.phase; }
    else if (t === 'phase_1_claim') { (L.phase1[ev.model_id] = L.phase1[ev.model_id] || { claims: [], stream: '' }).claims.push({ id: ev.claim_id, text: ev.text }); }
    else if (t === 'phase_1_response_completed') { var p = L.phase1[ev.model_id] = L.phase1[ev.model_id] || { claims: [] }; p.focus = ev.focus_tag; p.conf = ev.confidence; }
    else if (t === 'self_reflection') { L.reflections[ev.model_id] = { strong: ev.strongest_claim_id, weak: ev.weakest_claim_id, just: ev.tag_justification || '' }; }
    else if (t === 'phase_2_cross_reading') { L.crossreadings.push({ reader: ev.reader_model, target: ev.target_model, agreements: (ev.agreements || []).map(function (a) { return a.claim_id || a; }), disagreements: (ev.disagreements || []).map(function (d) { return { id: d.target_claim_id || d.id, reason: d.reason }; }) }); }
    else if (t === 'phase_3_turn') { L.turns.push({ id: ev.turn_id, speaker: ev.speaker_model, channel: ev.channel, target: ev.target_model, content: ev.content }); }
    else if (t === 'phase_4_artifact') { L.synthesis = { output: ev.output, trace: (ev.claim_trace || []).map(function (e) { return { id: e.claim_id, disp: e.disposition }; }) }; L.elevations = ev.elevations || []; }
    else if (t === 'phase_4_metrics') { L.metrics = ev.metrics; }
    else if (t === 'session_error') { L.error = { message: ev.message, phase: ev.phase, model_id: ev.model_id }; UI.sessionInFlight = false; }
    else if (t === 'session_completed') { UI.sessionInFlight = false; }

    UI.live = L;
    // Rebuild from the grown live object, then show everything (step = N).
    buildSession(L);
    UI.step = D.N;
    UI.liveStatus = L.error ? 'error · provider run stopped; dashboard remains available' : (UI.liveStatus.indexOf('streaming · ') === 0 ? UI.liveStatus : 'streaming · ' + (L.id || 'session'));
    applyStep();
    syncPromptInput();
  }

  function syncPromptInput() {
    var input = document.getElementById('gl-prompt');
    var btn = app.querySelector('[data-act="send-prompt"]');
    if (!input) return;
    var disabled = UI.sessionInFlight || !ws || ws.readyState !== WebSocket.OPEN;
    input.disabled = disabled;
    if (btn) btn.disabled = disabled;
    input.placeholder = UI.sessionInFlight ? 'session in flight…' : (disabled ? 'connecting…' : 'question for the lattice — Enter to submit');
  }

  function sendPrompt() {
    var input = document.getElementById('gl-prompt');
    if (!input || input.disabled) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var text = input.value;
    if (!text.trim()) return;
    ws.send(JSON.stringify({ type: 'prompt', text: text }));
    input.value = '';
    UI.sessionInFlight = true;
    syncPromptInput();
  }

  // ---------- shells (empty / waiting states) ----------
  function renderShell() {
    if (UI.mode === 'live' && !UI.live) {
      app.innerHTML =
        '<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:40px;">' +
          '<div style="display:flex;align-items:center;gap:11px;">' +
            '<span style="width:11px;height:11px;border-radius:50%;background:oklch(0.67 0.18 25);animation:glDot 1.4s ease-in-out infinite;"></span>' +
            '<span class="mono" style="font-size:13px;letter-spacing:0.28em;color:oklch(0.67 0.18 25);text-transform:uppercase;">Live</span>' +
          '</div>' +
          '<div style="font-size:23px;color:#eef0f4;text-align:center;max-width:560px;">Listening for a lattice run on this host.</div>' +
          '<div class="mono" id="gl-livestatus" style="font-size:12px;color:#707682;letter-spacing:0.04em;">' + esc(UI.liveStatus) + '</div>' +
          '<div style="display:flex;gap:8px;align-items:center;width:min(560px,90%);">' +
            '<input id="gl-prompt" type="text" placeholder="question for the lattice — Enter to submit" autocomplete="off" style="flex:1;background:#0c0d11;color:#d7dbe4;border:1px solid #242832;border-radius:6px;padding:8px 12px;font-family:var(--serif);font-size:14px;outline:none;" />' +
            '<button class="tbtn" data-act="send-prompt" style="font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:#0c0d11;background:oklch(0.84 0.14 88);border:none;border-radius:6px;padding:9px 16px;text-transform:uppercase;font-weight:600;">send</button>' +
          '</div>' +
          '<button class="tbtn" data-act="toggle-live" style="margin-top:6px;font-family:var(--mono);font-size:11px;letter-spacing:0.12em;color:#8b919d;background:#181b23;border:1px solid #242832;border-radius:6px;padding:9px 18px;text-transform:uppercase;">← Back to replay</button>' +
        '</div>';
      syncPromptInput();
      return;
    }
    if (!UI.sessions || UI.sessions.length === 0) {
      app.innerHTML =
        '<div style="height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;">' +
          '<div class="mono" style="font-size:11px;letter-spacing:0.3em;color:#707682;text-transform:uppercase;">Golden Lattice</div>' +
          '<div class="mono" style="font-size:13px;color:#8b919d;">no completed sessions to replay yet</div>' +
          '<button class="tbtn" data-act="toggle-live" style="margin-top:6px;font-family:var(--mono);font-size:11px;letter-spacing:0.12em;color:#8b919d;background:#181b23;border:1px solid #242832;border-radius:6px;padding:9px 18px;text-transform:uppercase;">Go Live →</button>' +
        '</div>';
    }
  }

  // ---------- event wiring (delegation; attached once) ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'session') selectSession(parseInt(t.getAttribute('data-i'), 10));
    else if (act === 'toggle-live') toggleLive();
    else if (act === 'toggle') toggle();
    else if (act === 'restart') restart();
    else if (act === 'speed') cycleSpeed();
    else if (act === 'send-prompt') sendPrompt();
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'gl-scrub') scrub(parseInt(e.target.value, 10) || 0);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'gl-prompt') { e.preventDefault(); sendPrompt(); }
  });
  window.addEventListener('resize', measure);

  // ---------- boot ----------
  function boot() {
    fetch('/sessions').then(function (r) { return r.json(); }).then(function (sessions) {
      UI.sessions = Array.isArray(sessions) ? sessions : [];
      if (UI.sessions.length === 0) { renderShell(); return; }
      var idx = parseInt(lsGet('gl-sess', '0'), 10) || 0;
      if (idx < 0 || idx >= UI.sessions.length) idx = 0;
      UI.sessionIdx = idx;
      buildSession(UI.sessions[idx]);
      var saved = parseInt(lsGet('gl-replay-step', '0'), 10) || 0;
      if (saved > D.N || saved < 0) saved = 0;
      UI.step = saved;
      UI.playing = saved < D.N;
      applyStep();
      if (UI.playing) startTimer();
    }).catch(function (err) {
      console.error('sessions load failed', err);
      UI.sessions = [];
      renderShell();
    });
  }
  boot();
})();
</script>
</body>
</html>
