[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golden-lattice"
version = "0.0.1"
description = "A structure that refuses the natural collapse of multi-model inference long enough for something else to emerge."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/golden_lattice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
