[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golden-lattice"
version = "0.0.1"
description = "A structure that refuses the natural collapse of multi-model inference long enough for something else to emerge."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "rich>=13.0",
    "httpx>=0.27",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The anthropic SDK is needed for live runs (AnthropicClient imports it lazily).
live = [
    "anthropic>=1.0",
]

[project.scripts]
golden-lattice = "golden_lattice.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_lattice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
